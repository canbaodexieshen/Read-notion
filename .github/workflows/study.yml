name: Study Heatmap Engine

on:
  push:
    branches: [main]
    paths: [update_study_heatmap.py, .github/workflows/study.yml]
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *" # 北京时间 23:00

# 正式授予机器人推送文件的权限
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      # 映射我们在 Secrets 里配置的两个密钥
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: "23ec37fee474812ebf9bfef7976c8ee6"
      
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.9
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install github-heatmap==1.3.8

      - name: Generate
        run: python update_study_heatmap.py

      - name: Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add study_heatmap/ old_heatmap/
          git commit -m "Update colored study heatmap" || echo "No changes"
          git push
